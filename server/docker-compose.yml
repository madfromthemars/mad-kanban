services:
  kanban:
    build: .
    container_name: kanban-team
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Change this. It is only used to create and list users.
      ADMIN_TOKEN: "change-me-admin-token"
      # Public URL your teammates will use, baked into the join strings the CLI prints.
      PUBLIC_URL: "http://localhost:8787"
      PORT: "8787"
      DATA_DIR: "/data"
      # Telegram notifications (notify.js). Put TELEGRAM_BOT_TOKEN=... in .env next to this
      # file (from @BotFather); without it notifications are off.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
    volumes:
      - kanban-data:/data
      # Plugin releases (scripts/release-plugin.sh uploads here); no rebuild needed.
      - ./public:/app/public:ro

volumes:
  kanban-data:
